  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #fff;
      font-family: var(--font-family);
      font-weight: 400;
      color: #000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    :root {
      --sidebar-w: 310px;
      --sidebar-gap: calc(var(--sidebar-w) / 2);
      --content-top: 1.25rem;
      --content-x: 1.5rem;
      --footer-h: 2.5rem;
      --content-h: calc(100vh - var(--content-top) - var(--footer-h));
      --font-title: "grad", "Grad", "Times New Roman", Times, serif;
      --font-family: var(--font-title);
      --text-size-content: 0.7rem;
      --text-size-footer: 0.55rem;
    }
    @font-face {
      font-family: "grad";
      src: url("https://use.typekit.net/af/83a95b/000000000000000077359721/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    .layout {
      min-height: 100vh;
    }
    /* Left sidebar - fixed */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sidebar-w);
      padding: 1.25rem 2.5rem 3rem;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 0;
      container-type: inline-size;
      font-family: var(--font-family);
    }
    .sidebar-title {
      margin-bottom: 3.5rem;
      display: block;
      width: 100%;
      font-family: var(--font-title);
      font-size: clamp(1rem, 20cqi, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.005em;
      text-transform: uppercase;
      color: #000;
      text-decoration: none;
      line-height: 0.95;
    }
    .sidebar-title:hover {
      color: #000;
    }
    .sidebar .nav-section:first-of-type {
      margin-bottom: 0;
    }
    .sidebar .sidebar-bottom {
      margin-top: 1.25rem;
    }
    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .sidebar-bottom .nav-section {
      gap: 1.25rem;
    }
    .nav-section a {
      font-family: var(--font-family);
      font-size: 0.8rem;
      letter-spacing: 0.005em;
      color: #000;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-section a:hover {
      color: #000;
    }
    .nav-section-uppercase a {
      text-transform: uppercase;
    }
    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .sidebar-instagram {
      display: block;
      color: #000;
      transition: color 0.2s;
    }
    .sidebar-instagram:hover {
      color: #000;
    }
    .sidebar-instagram svg {
      display: block;
      width: 12px;
      height: 12px;
    }
    /* Main content — top aligns with sidebar title */
    .main {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--content-top) var(--sidebar-gap) var(--footer-h) var(--sidebar-gap);
      background: #fff;
      overflow-y: auto;
      overflow-x: hidden;
      max-width: 100%;
      box-sizing: border-box;
      font-family: var(--font-family);
      font-size: var(--text-size-content);
    }
    .main-content {
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
    }
    .main-home {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .main-home img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center top;
      animation: fadeIn 4s ease-out forwards;
    }
    .main-iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
    .main-iframe.active {
      display: block;
    }
    .main-home.hidden {
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .page-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem 1rem 2.5rem;
      font-family: var(--font-family);
      font-size: var(--text-size-footer);
      letter-spacing: 0.005em;
      color: #000;
      background: #fff;
    }
    /* Mobile: apply only below 1024px; desktop unchanged above */
    @media (max-width: 1023px) {
      body { overflow-x: hidden; }
      .layout { display: flex; flex-direction: column; min-height: 100vh; height: 100vh; }
      .sidebar {
        position: relative;
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        padding: 1rem 1.25rem 0.25rem;
        gap: 0 1.25rem;
        flex-shrink: 0;
      }
      .sidebar-title { width: 100%; margin-bottom: 0.75rem; font-size: clamp(1rem, 20cqi, 2.25rem); }
      .sidebar-nav-row {
        width: 100%;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        gap: 1rem;
      }
      .sidebar .nav-section { flex-direction: row; gap: 1rem; margin-bottom: 0; flex-wrap: nowrap; }
      .sidebar .nav-section:first-of-type { margin-bottom: 0; }
      .sidebar .sidebar-bottom { flex-direction: row; margin-top: 0; gap: 1rem; flex-wrap: nowrap; }
      .main {
        margin-left: 0;
        flex: 1;
        min-height: 0;
        height: auto;
        display: flex;
        padding: 0 var(--content-x) var(--footer-h);
      }
      .main-content { flex: 1; min-height: 0; display: flex; height: 100%; }
      .main-home {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        height: 100%;
      }
      .main-home img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        object-position: center top;
      }
      .main-iframe.active { flex: 1; min-height: 0; height: 100%; }
      .main { -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
