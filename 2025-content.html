<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://use.typekit.net/ekp6eyt.css">
  <style>
    :root {
      --font-title: "grad", "Grad", "Times New Roman", Times, serif;
      --font-family: var(--font-title);
      --mobile-arrow-gutter: 1.75rem;
    }
    @font-face {
      font-family: "grad";
      src: url("https://use.typekit.net/af/83a95b/000000000000000077359721/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; max-width: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family);
      font-weight: 400;
      background: #fff;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .gallery-wrap {
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1;
    }
    .gallery-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .gallery-track { display: flex; height: 100%; transition: transform 0.4s ease; }
    .gallery-track.no-transition { transition: none; }
    .gallery-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
      position: relative;
    }
    .gallery-slide-img-wrap {
      height: 100%;
      width: auto;
      max-width: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .gallery-slide img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }
    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 1.25rem;
      height: 2.75rem;
      min-width: 0;
      border: none;
      background: transparent;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
      z-index: 3;
    }
    .gallery-arrow svg { width: 1.125rem; height: 1.125rem; display: block; }
    .gallery-arrow:hover { color: #000; }
    @media (hover: none) and (pointer: coarse) {
      .gallery-arrow { display: none; }
      .gallery-viewport {
        padding-left: 0;
        padding-right: 0;
        touch-action: pan-y;
        -webkit-user-select: none;
        user-select: none;
      }
    }
    @media (max-width: 1023px) {
      .gallery-viewport {
        padding-left: var(--mobile-arrow-gutter);
        padding-right: var(--mobile-arrow-gutter);
        box-sizing: border-box;
      }
      .gallery-arrow { width: 1.5rem; height: 3rem; }
      .gallery-arrow svg { width: 1.25rem; height: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="gallery-wrap">
    <div class="gallery-viewport">
      <div class="gallery-track" id="galleryTrack">
        <div class="gallery-slide" data-clone="last"><div class="gallery-slide-img-wrap"><img src="vatican.jpeg" alt="Vatican"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="the other cheek.jpeg" alt="The Other Cheek"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="serene.jpeg" alt="Serene"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="game Uno .jpeg" alt="Game Uno"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="picture2.png" alt="Paul"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="history of the fall.jpeg" alt="History of the Fall"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="And who's to judge.jpg" alt="And who's to judge"></div></div>
        <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="vatican.jpeg" alt="Vatican"></div></div>
        <div class="gallery-slide" data-clone="first"><div class="gallery-slide-img-wrap"><img src="the other cheek.jpeg" alt="The Other Cheek"></div></div>
      </div>
      <button type="button" class="gallery-arrow prev" id="galleryPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14 5 8 12 14 19"/></svg></button>
      <button type="button" class="gallery-arrow next" id="galleryNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="10 5 16 12 10 19"/></svg></button>
    </div>
  </div>
  <script>
    (function() {
      var track = document.getElementById('galleryTrack');
      var viewport = document.querySelector('.gallery-viewport');
      var prevBtn = document.getElementById('galleryPrev');
      var nextBtn = document.getElementById('galleryNext');
      var total = 9;
      var realCount = 7;
      var index = 1;
      var arrowGap = 8;
      var touchQuery = window.matchMedia('(hover: none) and (pointer: coarse)');
      var touchStartX = 0;
      var touchStartY = 0;
      var touchCurrentX = 0;
      var touchDragging = false;
      var swipeThreshold = 0.12;
      var wheelAccum = 0;
      var wheelIdleTimer = null;
      var wheelThreshold = 60;
      var wheelLocked = false;
      var padDragging = false;
      var padStartX = 0;
      var padCurrentX = 0;

      function isTouchDevice() {
        return touchQuery.matches;
      }

      function isIPad() {
        var ua = navigator.userAgent || '';
        if (/iPad/i.test(ua)) return true;
        return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      }

      function positionArrows() {
        if (isTouchDevice()) return;
        var slide = track.children[index];
        if (!slide || !viewport || !prevBtn || !nextBtn) return;
        var img = slide.querySelector('img');
        if (!img) return;
        var vpRect = viewport.getBoundingClientRect();
        var imgRect = img.getBoundingClientRect();
        var centerY = imgRect.top - vpRect.top + (imgRect.height / 2);
        var isMobile = window.matchMedia('(max-width: 1023px)').matches;
        var imgLeft = imgRect.left - vpRect.left;
        var imgRight = imgRect.right - vpRect.left;
        var vpWidth = vpRect.width;
        var prevW = prevBtn.offsetWidth;
        var nextW = nextBtn.offsetWidth;
        var prevLeft;
        var nextLeft;

        prevBtn.style.top = centerY + 'px';
        nextBtn.style.top = centerY + 'px';
        prevBtn.style.transform = 'translateY(-50%)';
        nextBtn.style.transform = 'translateY(-50%)';

        if (isMobile) {
          prevLeft = imgLeft - arrowGap - prevW;
          nextLeft = imgRight + arrowGap;
          prevLeft = Math.max(0, prevLeft);
          nextLeft = Math.min(vpWidth - nextW, nextLeft);
          if (prevLeft + prevW >= nextLeft) {
            prevLeft = 0;
            nextLeft = vpWidth - nextW;
          }
        } else {
          prevLeft = Math.max(0, imgLeft - arrowGap - prevW);
          nextLeft = imgRight + arrowGap;
        }

        prevBtn.style.left = prevLeft + 'px';
        nextBtn.style.left = nextLeft + 'px';
      }

      function scheduleArrowPosition() {
        if (isTouchDevice()) return;
        requestAnimationFrame(function() {
          requestAnimationFrame(positionArrows);
        });
      }

      function updateSlide(noTransition) {
        if (noTransition) track.classList.add('no-transition');
        track.style.transform = 'translateX(-' + (index * 100) + '%)';
        if (noTransition) {
          track.offsetHeight;
          track.classList.remove('no-transition');
        }
        scheduleArrowPosition();
      }

      function onTransitionEnd() {
        if (index === 0) {
          index = realCount;
          updateSlide(true);
        } else if (index === total - 1) {
          index = 1;
          updateSlide(true);
        } else {
          positionArrows();
        }
      }

      function goPrev() { index = (index - 1 + total) % total; updateSlide(); }
      function goNext() { index = (index + 1) % total; updateSlide(); }

      function onTouchStart(e) {
        if (!isTouchDevice() || e.touches.length !== 1) return;
        touchDragging = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchCurrentX = touchStartX;
        track.classList.add('no-transition');
      }

      function onTouchMove(e) {
        if (!touchDragging) return;
        touchCurrentX = e.touches[0].clientX;
        var deltaX = touchCurrentX - touchStartX;
        var deltaY = e.touches[0].clientY - touchStartY;
        if (Math.abs(deltaY) > Math.abs(deltaX)) return;
        var vpWidth = viewport.offsetWidth || 1;
        var pct = -(index * 100) + (deltaX / vpWidth) * 100;
        track.style.transform = 'translateX(' + pct + '%)';
      }

      function onTouchEnd(e) {
        if (!touchDragging) return;
        touchDragging = false;
        track.classList.remove('no-transition');
        var touch = e.changedTouches[0];
        var deltaX = touch.clientX - touchStartX;
        var deltaY = touch.clientY - touchStartY;
        if (Math.abs(deltaX) < Math.abs(deltaY)) {
          updateSlide();
          return;
        }
        var vpWidth = viewport.offsetWidth || 1;
        if (Math.abs(deltaX) > vpWidth * swipeThreshold) {
          if (deltaX < 0) goNext();
          else goPrev();
        } else {
          updateSlide();
        }
      }

      function onTouchCancel() {
        if (!touchDragging) return;
        touchDragging = false;
        track.classList.remove('no-transition');
        updateSlide();
      }

      function onWheel(e) {
        if (!isIPad()) return;
        if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
        if (Math.abs(e.deltaX) < 1) return;
        e.preventDefault();
        if (wheelLocked) return;

        wheelAccum += e.deltaX;
        clearTimeout(wheelIdleTimer);
        wheelIdleTimer = setTimeout(function() {
          wheelAccum = 0;
        }, 180);

        if (Math.abs(wheelAccum) >= wheelThreshold) {
          if (wheelAccum > 0) goNext();
          else goPrev();
          wheelAccum = 0;
          wheelLocked = true;
          setTimeout(function() { wheelLocked = false; }, 450);
        }
      }

      function onPointerDown(e) {
        if (!isIPad() || e.pointerType !== 'mouse' || e.button !== 0) return;
        padDragging = true;
        padStartX = e.clientX;
        padCurrentX = padStartX;
        viewport.setPointerCapture(e.pointerId);
        track.classList.add('no-transition');
      }

      function onPointerMove(e) {
        if (!padDragging || e.pointerType !== 'mouse') return;
        padCurrentX = e.clientX;
        var deltaX = padCurrentX - padStartX;
        var vpWidth = viewport.offsetWidth || 1;
        var pct = -(index * 100) + (deltaX / vpWidth) * 100;
        track.style.transform = 'translateX(' + pct + '%)';
      }

      function onPointerUp(e) {
        if (!padDragging || e.pointerType !== 'mouse') return;
        padDragging = false;
        if (viewport.hasPointerCapture(e.pointerId)) {
          viewport.releasePointerCapture(e.pointerId);
        }
        track.classList.remove('no-transition');
        var deltaX = padCurrentX - padStartX;
        var vpWidth = viewport.offsetWidth || 1;
        if (Math.abs(deltaX) > vpWidth * swipeThreshold) {
          if (deltaX < 0) goNext();
          else goPrev();
        } else {
          updateSlide();
        }
      }

      track.addEventListener('transitionend', onTransitionEnd);
      window.addEventListener('resize', positionArrows);
      track.querySelectorAll('img').forEach(function(img) {
        if (!img.complete) img.addEventListener('load', positionArrows);
      });
      viewport.addEventListener('touchstart', onTouchStart, { passive: true });
      viewport.addEventListener('touchmove', onTouchMove, { passive: true });
      viewport.addEventListener('touchend', onTouchEnd, { passive: true });
      viewport.addEventListener('touchcancel', onTouchCancel, { passive: true });
      viewport.addEventListener('wheel', onWheel, { passive: false });
      viewport.addEventListener('pointerdown', onPointerDown);
      viewport.addEventListener('pointermove', onPointerMove);
      viewport.addEventListener('pointerup', onPointerUp);
      viewport.addEventListener('pointercancel', onPointerUp);

      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      updateSlide(true);
    })();
  </script>
</body>
</html>
