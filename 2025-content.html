<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; background: #fff; min-height: 100%; height: 100%; display: flex; align-items: stretch; justify-content: center; padding: 1rem; box-sizing: border-box; }
    .gallery-wrap { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; flex: 1; --gallery-img-max-w: 500px; --gallery-img-max-h: 608px; --gallery-arrow-gap: 0.35rem; }
    .gallery-track { display: flex; height: 100%; transition: transform 0.4s ease; }
    .gallery-track.no-transition { transition: none; }
    .gallery-slide { flex: 0 0 100%; width: 100%; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 0.5rem; box-sizing: border-box; position: relative; }
    .gallery-slide-img-wrap {
      width: min(50vw, var(--gallery-img-max-w));
      height: min(74vh, var(--gallery-img-max-h));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-slide img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; object-position: center; display: block; }
    .gallery-caption {
      position: absolute;
      top: 0.35rem;
      bottom: auto;
      right: 0.75rem;
      text-align: left;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 300;
      color: #000;
      line-height: 1.4;
    }
    .gallery-caption .title { display: block; min-height: 1.4em; }
    .gallery-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; min-width: 40px; border: none; background: transparent; color: #000;
      cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
      transition: color 0.2s; z-index: 2;
    }
    .gallery-arrow svg { width: 30px; height: 30px; display: block; }
    .gallery-arrow:hover { color: #722F37; }
    .gallery-arrow.prev { left: calc(50% - (min(25vw, calc(var(--gallery-img-max-w) / 2))) - 40px - var(--gallery-arrow-gap)); }
    .gallery-arrow.next { right: calc(50% - (min(25vw, calc(var(--gallery-img-max-w) / 2))) - 40px - var(--gallery-arrow-gap)); }
    /* Desktop only: fixed arrows, gap from image, max image size, caption top-right two lines no gap */
    @media (min-width: 1024px) {
      .gallery-slide {
        padding: 0.35rem 3.25rem 0.5rem 3.25rem;
      }
      .gallery-slide-img-wrap {
        width: min(46vw, var(--gallery-img-max-w));
        height: min(76vh, var(--gallery-img-max-h));
      }
      .gallery-caption {
        top: 0.35rem;
        right: 0.75rem;
        line-height: 1;
      }
      .gallery-caption .title { display: block; min-height: 0; margin: 0; line-height: 1; }
    }
    @media (max-width: 480px) {
      .gallery-arrow { width: 36px; height: 36px; min-width: 36px; }
      .gallery-arrow svg { width: 26px; height: 26px; }
      .gallery-arrow.prev { left: 0.75rem; }
      .gallery-arrow.next { right: 0.75rem; }
    }
    /* Mobile only: bigger images (fit whole), same caption gap portrait/landscape */
    @media (max-width: 1023px) {
      html, body { min-height: 100%; height: auto; }
      .gallery-wrap { min-height: 72vh; position: relative; overflow-x: hidden; overflow-y: visible; }
      .gallery-track { min-height: 72vh; }
      .gallery-slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 2.25rem 0.75rem;
        gap: 0;
        min-height: 72vh;
        box-sizing: border-box;
      }
      .gallery-slide-img-wrap {
        width: min(84vw, var(--gallery-img-max-w));
        height: min(64vh, var(--gallery-img-max-h));
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gallery-slide img {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
      }
      .gallery-caption {
        position: static;
        align-self: flex-end;
        text-align: right;
        font-size: 0.65rem;
        line-height: 1;
        max-width: 100%;
        margin: 0.25rem 0 0 0;
        padding: 0;
      }
      .gallery-caption .title { display: block; min-height: 0; margin: 0; line-height: 1; }
      .gallery-arrow {
        top: 50%;
        transform: translateY(-50%);
      }
      .gallery-arrow.prev { left: calc(50% - (min(42vw, calc(var(--gallery-img-max-w) / 2))) - 36px - var(--gallery-arrow-gap)); }
      .gallery-arrow.next { right: calc(50% - (min(42vw, calc(var(--gallery-img-max-w) / 2))) - 36px - var(--gallery-arrow-gap)); }
    }
  </style>
</head>
<body>
  <div class="gallery-wrap">
    <div class="gallery-track" id="galleryTrack">
      <div class="gallery-slide" data-clone="last"><div class="gallery-slide-img-wrap"><img src="vatican.jpeg" alt="Vatican"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="the other cheek.jpeg" alt="The Other Cheek"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="serene.jpeg" alt="Serene"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="game Uno .jpeg" alt="Game Uno"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="picture2.png" alt="Paul"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="history of the fall.jpeg" alt="History of the Fall"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="And who's to judge.jpg" alt="And who's to judge"></div></div>
      <div class="gallery-slide"><div class="gallery-slide-img-wrap"><img src="vatican.jpeg" alt="Vatican"></div></div>
      <div class="gallery-slide" data-clone="first"><div class="gallery-slide-img-wrap"><img src="the other cheek.jpeg" alt="The Other Cheek"></div></div>
    </div>
    <button type="button" class="gallery-arrow prev" id="galleryPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg></button>
    <button type="button" class="gallery-arrow next" id="galleryNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg></button>
  </div>
  <script>
    (function() {
      var track = document.getElementById('galleryTrack');
      var prevBtn = document.getElementById('galleryPrev');
      var nextBtn = document.getElementById('galleryNext');
      var total = 9;
      var realCount = 7;
      var index = 1;
      function updateSlide(noTransition) {
        if (noTransition) track.classList.add('no-transition');
        track.style.transform = 'translateX(-' + (index * 100) + '%)';
        if (noTransition) { track.offsetHeight; track.classList.remove('no-transition'); }
      }
      function onTransitionEnd() {
        if (index === 0) { index = realCount; updateSlide(true); }
        else if (index === total - 1) { index = 1; updateSlide(true); }
      }
      track.addEventListener('transitionend', onTransitionEnd);
      function goPrev() { index = (index - 1 + total) % total; updateSlide(); }
      function goNext() { index = (index + 1) % total; updateSlide(); }
      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      updateSlide(true);
    })();
  </script>
</body>
</html>
