  <script>
    (function() {
      var track = document.getElementById('galleryTrack');
      var viewport = document.querySelector('.gallery-viewport');
      var prevBtn = document.getElementById('galleryPrev');
      var nextBtn = document.getElementById('galleryNext');
      var total = 9;
      var realCount = 7;
      var index = 1;
      var arrowGap = 8;
      var touchQuery = window.matchMedia('(hover: none) and (pointer: coarse)');
      var touchStartX = 0;
      var touchStartY = 0;
      var touchCurrentX = 0;
      var touchDragging = false;
      var swipeThreshold = 0.12;

      function isTouchDevice() {
        return touchQuery.matches;
      }

      function positionArrows() {
        if (isTouchDevice()) return;
        var slide = track.children[index];
        if (!slide || !viewport || !prevBtn || !nextBtn) return;
        var img = slide.querySelector('img');
        if (!img) return;
        var vpRect = viewport.getBoundingClientRect();
        var imgRect = img.getBoundingClientRect();
        var centerY = imgRect.top - vpRect.top + (imgRect.height / 2);
        var isMobile = window.matchMedia('(max-width: 1023px)').matches;
        var imgLeft = imgRect.left - vpRect.left;
        var imgRight = imgRect.right - vpRect.left;
        var vpWidth = vpRect.width;
        var prevW = prevBtn.offsetWidth;
        var nextW = nextBtn.offsetWidth;
        var prevLeft;
        var nextLeft;

        prevBtn.style.top = centerY + 'px';
        nextBtn.style.top = centerY + 'px';
        prevBtn.style.transform = 'translateY(-50%)';
        nextBtn.style.transform = 'translateY(-50%)';

        if (isMobile) {
          prevLeft = imgLeft - arrowGap - prevW;
          nextLeft = imgRight + arrowGap;
          prevLeft = Math.max(0, prevLeft);
          nextLeft = Math.min(vpWidth - nextW, nextLeft);
          if (prevLeft + prevW >= nextLeft) {
            prevLeft = 0;
            nextLeft = vpWidth - nextW;
          }
        } else {
          prevLeft = Math.max(0, imgLeft - arrowGap - prevW);
          nextLeft = imgRight + arrowGap;
        }

        prevBtn.style.left = prevLeft + 'px';
        nextBtn.style.left = nextLeft + 'px';
      }

      function scheduleArrowPosition() {
        if (isTouchDevice()) return;
        requestAnimationFrame(function() {
          requestAnimationFrame(positionArrows);
        });
      }

      function updateSlide(noTransition) {
        if (noTransition) track.classList.add('no-transition');
        track.style.transform = 'translateX(-' + (index * 100) + '%)';
        if (noTransition) {
          track.offsetHeight;
          track.classList.remove('no-transition');
        }
        scheduleArrowPosition();
      }

      function onTransitionEnd() {
        if (index === 0) {
          index = realCount;
          updateSlide(true);
        } else if (index === total - 1) {
          index = 1;
          updateSlide(true);
        } else {
          positionArrows();
        }
      }

      function goPrev() {
        index = index - 1;
        if (index < 0) index = total - 1;
        updateSlide();
      }
      function goNext() {
        index = index + 1;
        if (index >= total) index = 0;
        updateSlide();
      }

      function onTouchStart(e) {
        if (!isTouchDevice() || e.touches.length !== 1) return;
        touchDragging = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchCurrentX = touchStartX;
        track.classList.add('no-transition');
      }

      function onTouchMove(e) {
        if (!touchDragging) return;
        touchCurrentX = e.touches[0].clientX;
        var deltaX = touchCurrentX - touchStartX;
        var deltaY = e.touches[0].clientY - touchStartY;
        if (Math.abs(deltaY) > Math.abs(deltaX)) return;
        var vpWidth = viewport.offsetWidth || 1;
        var pct = -(index * 100) + (deltaX / vpWidth) * 100;
        track.style.transform = 'translateX(' + pct + '%)';
      }

      function onTouchEnd(e) {
        if (!touchDragging) return;
        touchDragging = false;
        track.classList.remove('no-transition');
        var touch = e.changedTouches[0];
        var deltaX = touch.clientX - touchStartX;
        var deltaY = touch.clientY - touchStartY;
        if (Math.abs(deltaX) < Math.abs(deltaY)) {
          updateSlide();
          return;
        }
        var vpWidth = viewport.offsetWidth || 1;
        if (Math.abs(deltaX) > vpWidth * swipeThreshold) {
          if (deltaX < 0) goNext();
          else goPrev();
        } else {
          updateSlide();
        }
      }

      function onTouchCancel() {
        if (!touchDragging) return;
        touchDragging = false;
        track.classList.remove('no-transition');
        updateSlide();
      }

      track.addEventListener('transitionend', onTransitionEnd);
      window.addEventListener('resize', positionArrows);
      track.querySelectorAll('img').forEach(function(img) {
        if (!img.complete) img.addEventListener('load', positionArrows);
      });
      viewport.addEventListener('touchstart', onTouchStart, { passive: true });
      viewport.addEventListener('touchmove', onTouchMove, { passive: true });
      viewport.addEventListener('touchend', onTouchEnd, { passive: true });
      viewport.addEventListener('touchcancel', onTouchCancel, { passive: true });

      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      updateSlide(true);
    })();
  </script>
